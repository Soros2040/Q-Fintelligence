[project]
name = "q-fintelligence-worker-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cqlib==1.3.11",
  "filetype==1.2.0",
  "h5py==3.16.0",
  "numpy==2.4.6",
  "openpyxl==3.1.5",
  "pandas==3.0.3",
  "pandera[pandas]==0.32.1",
  "pyarrow==25.0.0",
  "pydantic==2.12.5",
  "pypdf==6.14.2",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
  "statsmodels==0.14.6",
]

[dependency-groups]
dev = [
  "pytest==9.0.1",
  "ruff==0.14.7",
]

[tool.uv.workspace]
members = ["workers/finance", "workers/quantum"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
